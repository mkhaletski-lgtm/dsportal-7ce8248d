name: Build & Deploy to main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Clean and deploy
        run: |
          git rm -r --ignore-unmatch *
          cp -r dist/* .
          rmdir dist

      - name: Commit back
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 Deploy built site"
          branch: main
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
